<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyKit</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--card:#f4f5f7;--acc:#2f5bea;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#eceef2;--mut:#9aa3b2;--card:#22262e;--acc:#7c9cff;--ok:#4ade80;--bad:#f87171}}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:760px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}button:disabled{opacity:.5}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:10px 0}
.fc{cursor:pointer;min-height:48px}.fc small{color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;cursor:pointer}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
#st{color:var(--mut)}#warn{color:var(--bad)}
</style></head><body>
<h1>StudyKit</h1><p class="s">Upload a PDF or text file. Get a summary, flashcards and a quiz.</p>
<div class="row">
<input id="f" type="file" accept=".pdf,.txt,.md">
<select id="m"><option value="all">All</option><option value="summary">Summary</option><option value="flashcards">Flashcards</option><option value="quiz">Quiz</option></select>
<label>Items <input id="n" type="number" min="1" max="50" value="8" style="width:64px"></label>
<button class="p" id="go">Generate</button></div>
<div id="st"></div><div id="warn"></div><div id="out"></div>
<div class="row" id="dl" hidden><button id="dmd">Download Markdown</button><button id="dan">Download Anki file</button></div>
<script>
const $=i=>document.getElementById(i);let last=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
$('go').onclick=async()=>{
 const file=$('f').files[0];if(!file){$('st').textContent='Choose a file first.';return}
 const fd=new FormData();fd.append('file',file);fd.append('mode',$('m').value);fd.append('n',$('n').value);
 $('go').disabled=true;$('st').textContent='Working...';$('warn').textContent='';$('out').replaceChildren();$('dl').hidden=true;
 try{const r=await fetch('/api/generate',{method:'POST',body:fd});const j=await r.json();
  if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));
  last=j;render(j);$('st').textContent='Done ('+j.backend+' backend).';$('dl').hidden=false}
 catch(e){$('st').textContent='Error: '+e.message}finally{$('go').disabled=false}};
function render(j){const o=$('out');o.replaceChildren();$('warn').textContent=(j.warnings||[]).join(' ');
 if(j.summary.length){o.append(el('h2',0,'Summary'));const u=el('ul');j.summary.forEach(b=>u.append(el('li',0,b)));o.append(u)}
 if(j.flashcards.length){o.append(el('h2',0,'Flashcards (click to flip)'));
  j.flashcards.forEach(c=>{const d=el('div','card fc');const t=el('div',0,c.front);d.append(t);let b=false;
   d.onclick=()=>{b=!b;t.textContent=b?c.back:c.front;d.style.outline=b?'2px solid var(--acc)':'none'};o.append(d)})}
 if(j.quiz.length){o.append(el('h2',0,'Quiz'));const sc=el('div');let right=0,done=0;
  j.quiz.forEach((q,i)=>{const d=el('div','card');d.append(el('b',0,(i+1)+'. '+q.question));
   q.options.forEach((op,k)=>{const b=el('button','opt','ABCD'[k]+'. '+op);b.onclick=()=>{
     if(d.dataset.done)return;d.dataset.done=1;done++;
     const bs=d.querySelectorAll('.opt');bs[q.answer_index].classList.add('ok');
     if(k===q.answer_index)right++;else b.classList.add('bad');
     if(q.explanation)d.append(el('small',0,q.explanation));
     sc.textContent='Score: '+right+' / '+done};d.append(b)});o.append(d)});o.append(sc)}}
async function dl(fmt,name){const r=await fetch('/api/export/'+fmt,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(last)});
 const a=el('a');a.href=URL.createObjectURL(await r.blob());a.download=name;a.click()}
$('dmd').onclick=()=>dl('md','studypack.md');$('dan').onclick=()=>dl('anki','flashcards.tsv');
</script></body></html>
